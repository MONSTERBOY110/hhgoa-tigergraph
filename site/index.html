<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavach · fraud investigations on TigerGraph</title>
<meta name="description" content="Kavach, an agentic fraud investigator on TigerGraph: every Hacker House Goa 2026 case with its evidence, rule-cited actions, approval routes, a step-by-step audit replay, attested claims, the case file and ring replays.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%23f58220'/%3E%3Ccircle cx='16' cy='13' r='3' fill='%2316181d'/%3E%3Ccircle cx='10.5' cy='19' r='2' fill='%2316181d'/%3E%3Ccircle cx='21.5' cy='19' r='2' fill='%2316181d'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Manrope";src:url("fonts/manrope-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Manrope";src:url("fonts/manrope-600.woff2") format("woff2");font-weight:500 650;font-display:swap}
@font-face{font-family:"Manrope";src:url("fonts/manrope-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-600.woff2") format("woff2");font-weight:500 700;font-display:swap}
:root{
  --ground:#15171c; --panel:#1c1f26; --panel-2:#222630; --line:#2d323d; --line-2:#3a404d;
  --ink:#ecebe8; --ink-2:#b7bcc6; --ink-3:#8d94a1;
  --tg:#f58220; --tg-soft:rgba(245,130,32,.14); --tg-line:rgba(245,130,32,.55);
  --fraud:#ff6b5b; --legit:#56d39c; --uncertain:#f2c14e;
  --auto:#8d94a1; --l1:#f2c14e; --l2:#ff6b5b;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--tg);color:#15171c}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid var(--ground)}
:focus-visible{outline:2px solid var(--tg);outline-offset:2px;border-radius:4px}
a{color:var(--tg);text-underline-offset:3px}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
.pipe{font-family:var(--mono);font-weight:400;color:var(--ink-3);padding:0 .1em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}

/* ---------- top bar ---------- */
header.bar{height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:4px}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs button{background:none;border:0;color:var(--ink-2);padding:8px 12px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--panel-2)}
nav.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--tg)}
.bar .spacer{flex:1}
.bar .meta{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.bar .meta b{color:var(--ink-2);font-weight:600}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 56px)}
aside.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--ground)}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:14px 14px 2px}
.rounds button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px 8px;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;gap:0;min-width:0}
.rounds button b{font-weight:650;color:var(--ink);font-size:13px}
.rounds button span{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rounds button:hover{border-color:var(--line-2);color:var(--ink)}
.rounds button[aria-pressed=true]{background:var(--tg-soft);border-color:var(--tg-line)}
.rounds button[aria-pressed=true] span{color:var(--ink-2)}
.filters{display:flex;gap:6px;padding:12px 14px 10px;flex-wrap:wrap}
.filters button{font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.filters button:hover{border-color:var(--line-2);color:var(--ink)}
.filters button[aria-pressed=true]{border-color:var(--tg-line);color:var(--ink);background:var(--tg-soft)}
.filters .n{color:var(--ink-3);margin-left:4px}
ol.cases{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1}
ol.cases li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:74px 1fr auto;gap:2px 10px;width:100%;padding:9px 10px;border-radius:var(--r);cursor:pointer}
ol.cases li button:hover{background:var(--panel)}
ol.cases li button[aria-current=true]{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2)}
ol.cases li button:focus-visible{outline:2px solid var(--tg);outline-offset:-2px}
.cid{font-family:var(--mono);font-size:13px;color:var(--ink)}
.pat{grid-column:2/4;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{text-align:right;color:var(--ink-2);font-size:12.5px}
.vd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.vd i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.vd.fraud i{background:var(--fraud)}.vd.legitimate i{background:var(--legit)}.vd.uncertain i{background:var(--uncertain)}
.rail .foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}

main{overflow:auto;min-width:0}
.case{max-width:1180px;margin:0 auto;padding:26px 32px 64px}
.head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.01em}
.head .status{font-size:13px;color:var(--ink-2);padding:3px 10px;border:1px solid var(--line-2);border-radius:999px}
.head .rnd{font-size:12.5px;color:var(--ink-3)}
.trigger{margin:10px 0 0;color:var(--ink-2);max-width:92ch}
.trigger .who{color:var(--ink-3);font-size:12.5px;display:block;margin-top:4px}
mark.hostile{background:none;color:var(--ink);text-decoration:underline wavy var(--uncertain) 1px;text-underline-offset:4px;text-decoration-skip-ink:none}
.flagline{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:12.5px;color:var(--ink-2);max-width:92ch}
.flagline svg{width:14px;height:14px;flex:none;margin-top:3px}

/* ---------- instrument strip ---------- */
.strip{display:grid;grid-template-columns:1.4fr 1.6fr 1.5fr 1fr 1fr 1.2fr;margin:22px 0 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.gauge{padding:14px 16px 12px;border-right:1px solid var(--line);min-width:0}
.gauge:last-child{border-right:0}
.gauge .v.p{margin-bottom:8px}
.gauge .v{font-size:20px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .v.wrap{white-space:normal;font-size:16px;line-height:1.25}
.gauge .v.small{font-size:15px;font-weight:600;font-family:var(--mono)}
.gauge .pl{margin-top:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge.verdict .v{display:flex;align-items:center;gap:8px}
.gauge.verdict .v i{width:10px;height:10px;border-radius:50%}
.scale{position:relative;height:30px;margin-top:4px}
.scale .track{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line-2);border-radius:2px}
.scale .zone{position:absolute;top:8px;height:2px}
.scale .tick{position:absolute;top:4px;width:1px;height:10px;background:var(--ink-3)}
.scale .needle{position:absolute;top:0;width:3px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-1px);transition:left .5s cubic-bezier(.16,1,.3,1)}
.scale .lbl.up{top:-9px}
.scale .lbl{position:absolute;top:19px;font-size:10px;line-height:1;color:var(--ink-3);transform:translateX(-50%)}

/* ---------- case tabs ---------- */
.ctabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:24px}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{background:none;border:0;color:var(--ink-2);padding:10px 12px 11px;cursor:pointer;white-space:nowrap;border-radius:var(--r) var(--r) 0 0}
.ctabs button:hover{color:var(--ink);background:var(--panel)}
.ctabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--tg)}
.ctabs button:focus-visible{outline-offset:-2px}
.ctabs .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:7px}
.ctabs .c.warn{color:var(--uncertain)}
.tabpanel:focus{outline:none}

/* ---------- sections ---------- */
section.blk{margin-top:34px}
section.blk:first-child{margin-top:0}
section.blk>h2{font-size:15px;font-weight:650;margin:0 0 12px;letter-spacing:.01em}
section.blk>h2 .aside{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:8px}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:34px}
.two>section.blk{margin-top:0}
.actions.pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.actions.pair .acol+.acol{border-left:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.prose{padding:16px 18px;color:var(--ink);max-width:75ch}
.prose p{margin:0 0 10px}.prose p:last-child{margin:0}
.prose .muted{color:var(--ink-2)}
.lede{color:var(--ink-2);max-width:80ch;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--ink-3);font-size:12.5px;margin:0 0 14px}
.facts b{color:var(--ink-2);font-weight:600}
.facts .mono{color:var(--ink-2)}
.empty{padding:22px 22px 20px;max-width:80ch}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:650}
.empty p{margin:0 0 6px;color:var(--ink-2)}
.empty .hint{color:var(--ink-3);font-size:12.5px;margin:0}
.loading{padding:22px;color:var(--ink-3)}

/* command box */
.cmd{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);max-width:100%;vertical-align:middle}
.cmd .cmd-l{font-size:12px;color:var(--ink-3);padding:0 2px 0 10px;white-space:nowrap}
.cmd code{font-family:var(--mono);font-size:12px;color:var(--ink);padding:6px 10px;white-space:nowrap;overflow:auto;scrollbar-width:none}
.cmd button{border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:12px;padding:6px 11px;cursor:pointer;border-radius:0 var(--r) var(--r) 0;align-self:stretch}
.cmd button:hover{color:var(--ink);background:var(--panel-2)}
.cmd button.ok{color:var(--legit)}
.cmdrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}

/* graph */
.graph{position:relative;padding:6px}
.graph>svg{display:block;width:100%;height:auto}
.graph .legend svg{width:10px;height:10px;flex:none}
.graph .legend{display:flex;gap:14px;flex-wrap:wrap;padding:4px 12px 10px;color:var(--ink-3);font-size:11.5px}
.graph .legend span{display:inline-flex;align-items:center;gap:6px}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.2}
.edge.hot{stroke:var(--tg-line);stroke-width:1.6}
.edge.dash{stroke-dasharray:3 4}
.draw .edge{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s cubic-bezier(.16,1,.3,1) forwards}
.draw .edge.dash{stroke-dasharray:3 4;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
.node text{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.node .big{font-size:12px;fill:var(--ink);font-weight:600}

/* ledger tables */
table.ledger{width:100%;border-collapse:collapse;font-size:13px}
table.ledger th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ledger td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.ledger tr:last-child td{border-bottom:0}
table.ledger td.claim{max-width:62ch}
table.ledger .num{text-align:right;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.src svg{width:14px;height:14px;flex:none}
.ref{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-word;margin-top:4px}
.ids{display:flex;flex-wrap:wrap;gap:4px}
.id{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
a.id,button.id{cursor:pointer;text-decoration:none}
a.id:hover,button.id:hover{border-color:var(--tg-line);color:var(--ink)}
.idl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px;align-self:center}
.att{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.att button{all:unset;cursor:pointer;font-family:var(--mono);color:var(--ink-2);border-bottom:1px dotted var(--ink-3)}
.att button:hover{color:var(--tg);border-color:var(--tg)}
.att button:focus-visible{outline:2px solid var(--tg);outline-offset:2px}

/* status badges (re-run of an attested claim) */
.st{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;line-height:17px;display:inline-block}
.st.pass{color:var(--legit)}.st.fail{color:var(--fraud)}.st.unverifiable,.st.none{color:var(--ink-3)}

/* actions */
.actions{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);gap:0;align-items:stretch}
.acol{padding:14px 16px}
.acol h3{margin:0 0 10px;font-size:13px;font-weight:650}
.acol h3 span{color:var(--ink-3);font-weight:400}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.act b{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.act .why{grid-column:1/3;color:var(--ink-2);font-size:12.5px}
.route{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;align-self:start;white-space:nowrap}
.route.auto{color:var(--auto)}.route.L1{color:var(--l1)}.route.L2{color:var(--l2)}
.bridge{border-left:1px solid var(--line);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--panel-2);font-size:12.5px;color:var(--ink-2)}
.bridge .arrow{display:block;width:100%;height:14px}
.bridge .down{display:none;width:14px;height:18px;margin:0 auto}
.bridge q{display:block;color:var(--ink);quotes:none}
.bridge .step{color:var(--ink-3);font-size:11.5px}
.changed{padding:12px 16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:13px}

/* SAR */
.sar{padding:18px 20px}
.sar p{margin:0;max-width:78ch;line-height:1.65}
.sar .facts{margin:14px 0 0;gap:20px}
.nosar{padding:14px 18px;color:var(--ink-2)}

.footline{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:26px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.footline b{color:var(--ink-2);font-weight:600}

/* ---------- replay ---------- */
table.steps td{padding:9px 12px}
table.steps th{padding:10px 12px}
table.steps td.x{width:34px;padding-right:0}
table.steps td.n{width:34px;color:var(--ink-3);font-family:var(--mono);font-size:12px}
.xbtn{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--ink-3)}
.xbtn:hover{background:var(--panel-2);color:var(--ink)}
.xbtn:focus-visible{outline:2px solid var(--tg);outline-offset:0}
.xbtn svg{width:12px;height:12px;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.xbtn[aria-expanded=true] svg{transform:rotate(90deg)}
.phase{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.phase b{color:var(--ink-2);font-weight:600;margin-right:6px}
.call{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.call b{font-weight:600;color:var(--ink)}
.call.full{display:block;-webkit-line-clamp:unset}
.sha{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.errtxt{color:var(--fraud);font-size:12.5px;margin-top:4px}
tr.more>td{background:var(--panel-2);padding:14px 16px 16px}
tr.more[hidden]{display:none}
.moregrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 26px}
.moregrid h4{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
dl.kv{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-family:var(--mono);font-size:12px}
dl.kv dt{color:var(--ink-3)}dl.kv dd{margin:0;color:var(--ink);word-break:break-word}
.linked{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:12.5px;color:var(--ink-2)}
.linked li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
tr.chk>td{padding:0;background:var(--panel-2);box-shadow:inset 0 1px 0 var(--tg-line)}
.snap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px 26px;padding:16px 18px 18px}
.snap-h .lbl{font-size:13px;font-weight:650;color:var(--ink)}
.snap-h .ckid{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:8px}
.snap-h .pv{font-size:20px;font-weight:650;margin-top:4px;display:flex;align-items:baseline;gap:8px}
.snap-h .pv small{font-size:12.5px;color:var(--ink-3);font-weight:400}
.snap-h .vd{margin-top:4px}
.gbars{display:grid;grid-template-columns:max-content minmax(80px,1fr) max-content;gap:7px 12px;align-items:center;font-size:12.5px}
.gname{color:var(--ink-2)}
.gname.mv{color:var(--ink)}
.gtrack{position:relative;height:12px}
.gtrack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.gbar{position:absolute;top:3px;height:6px;border-radius:2px}
.gbar.pos{background:var(--fraud)}.gbar.neg{background:var(--legit)}
.gbar.was{top:1px;height:10px;background:none;border:1px dashed var(--ink-3)}
.gval{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.gval s{color:var(--ink-3);text-decoration:none;margin-right:6px}
.gaxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);grid-column:2}
.sigs{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.sigs li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:12.5px;color:var(--ink-2)}

/* ---------- attestation ---------- */
table.claims td.cid2{width:76px;white-space:nowrap}

/* ---------- case file ---------- */
.cfstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:22px}

.wait{display:grid;gap:0}
.wait .w{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}

ol.tl .dot{position:absolute;left:4px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line-2)}

ol.tl .dot.bad{background:var(--fraud);box-shadow:none}
ol.tl .body{padding:8px 0 10px;border-bottom:1px solid var(--line)}

/* ---------- ring replay ---------- */

.axis{display:grid;grid-template-columns:150px minmax(0,1fr);margin:2px 0 8px}

.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);pointer-events:none;opacity:.7}

.rolechip{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- monitor and detectors ---------- */
.mon{max-width:1180px;margin:0 auto;padding:26px 32px 64px}
.mon h1{font-size:22px;margin:0 0 8px}
.mon p.lede{color:var(--ink-2);max-width:80ch;margin:0 0 22px}
.det{margin-bottom:14px}
.det-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}

.det-b .rule{color:var(--ink)}
.bt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bt>div{padding:11px 16px 9px;border-right:1px solid var(--line);min-width:0}
.bt>div:last-child{border-right:0}
.bt .v{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .pl{margin-top:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.35}

  .cfstrip{grid-template-columns:repeat(3,minmax(0,1fr))}.cfstrip>div:nth-child(3){border-right:0}.cfstrip>div:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .bt{grid-template-columns:repeat(3,minmax(0,1fr))}.bt>div:nth-child(3){border-right:0}.bt>div:nth-child(-n+3){border-bottom:1px solid var(--line)}}

  .actions,.actions.pair{grid-template-columns:1fr}.actions.pair .acol+.acol{border-left:0;border-top:1px solid var(--line)}.bridge{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .bridge .arrow{display:none}.bridge .down{display:block}
  .bar .meta,.brand small{display:none}
  header.bar{gap:8px;padding:0 12px}nav.tabs{margin-left:0;overflow-x:auto;scrollbar-width:none}nav.tabs button{padding:8px}
  .brand .wm{display:none}
  table.ledger thead{display:none}table.ledger td{display:block;border-bottom:0;padding:6px 14px}table.ledger tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  table.ledger tr:last-child{border-bottom:0}
  table.steps tr.tool{display:grid;grid-template-columns:30px 24px minmax(0,1fr) auto;align-items:center;padding:8px 10px 10px}
  table.steps tr.tool td{padding:3px 4px;width:auto}
  table.steps tr.tool td:nth-child(4),table.steps tr.tool td:nth-child(6),table.steps tr.tool td:nth-child(7){grid-column:1/-1}
  table.steps tr.tool td:nth-child(5){grid-row:1;grid-column:4}
  table.steps td.cl{display:flex!important;gap:8px;align-items:baseline}table.steps td.cl::before{content:"Claims";font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  tr.more>td{padding:12px 14px 14px}tr.chk>td{padding:0}tr.chk,tr.more{padding:0}
  .snap,.moregrid,.endgrid{grid-template-columns:1fr}.endgrid>div+div{border-left:0;border-top:1px solid var(--line)}
  .lrow,.chart,.axis{grid-template-columns:104px minmax(0,1fr)}.playwrap{left:104px;right:10px}
  .lrow .ll{padding:0 8px 0 12px;font-size:10.5px}.track,.axis .ax{margin-right:10px}.chart svg{width:calc(100% - 10px)}
  .chart .cl{padding:0 8px 4px 12px}
  .controls{grid-template-columns:auto auto auto;}.controls input.scrub{grid-column:1/-1}
  .kvrow{grid-template-columns:1fr}
  table.ledger td[data-l]{text-align:left}table.ledger td[data-l]::before{content:attr(data-l) " ";font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
  table.joins tr[aria-current=true]{background:var(--tg-soft)}table.joins tr[aria-current=true] td{background:none}
  .cmd{flex-wrap:wrap;width:100%}.cmd code{white-space:normal;word-break:break-all;flex:1 1 180px}.cmd .cmd-l{padding:6px 2px 0 10px;flex-basis:100%}
  .cmd button{border-radius:0 0 var(--r) 0}
  .readouts .v.t{white-space:normal;font-size:13px}.readouts .pl{white-space:normal}
  table.joins tr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 8px;padding:8px 14px}
  table.joins td{padding:0}table.joins td:nth-child(4),table.joins td:nth-child(6),table.joins td:nth-child(7){display:none}

}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,1fr)}.gauge{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.gauge:nth-child(2n){border-right:0!important}

  .readouts .v{font-size:15px}}

<header class="bar">

    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="#f58220"/><path d="M16 13 10.5 19M16 13l5.5 6M10.5 19h11" stroke="#15171c" stroke-width="1.6"/><circle cx="16" cy="13" r="3" fill="#15171c"/><circle cx="10.5" cy="19" r="2.2" fill="#15171c"/><circle cx="21.5" cy="19" r="2.2" fill="#15171c"/></svg>

<script>
(() => {
  const D = window.KAVACH || {meta: {}, rounds: [], cases: [], monitor: [], detectors: {}};

  const money = v => "$" + Number(v || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const int = v => Number(v || 0).toLocaleString("en-US");
  const utc = s => s ? String(s).replace("T", " ").replace(/\.\d+Z$/, " UTC").replace(/Z$/, " UTC") : "";
  const signed = v => (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(2);
  const plural = (n, word) => `${int(n)} ${word}${Number(n) === 1 ? "" : "s"}`;

    out_of_region_use: "Out of region use", account_takeover: "Account takeover", undocumented: "Undocumented pattern", none: "No fraud"};
  const STATUS = {closed_fraud: "Closed as fraud", closed_legitimate: "Closed as legitimate", escalated: "Escalated to analyst", open: "Open, under monitoring"};
  const TRIG = {risk_score: "Model risk score", customer_report: "Customer report", analyst_request: "Analyst request"};
  const ROLE = {L1: "team lead", L2: "fraud manager", auto: "agent acts alone"};
  const VCOL = {fraud: "var(--fraud)", legitimate: "var(--legit)", uncertain: "var(--uncertain)"};

      timer = setInterval(() => { if (cur >= T.length - 1) { stop(); setFrame(cur, true); return; } setFrame(cur + per); }, reduce ? 250 : 40);
      playBtn.setAttribute("aria-label", "Pause"); playBtn.innerHTML = ""; playBtn.append(icon("pause"), h("span", {text: "Pause"}));
      now.setAttribute("aria-live", "off");
    }
    playBtn.onclick = () => timer ? stop() : play();
    nextBtn.onclick = () => { stop(); const n = joins.find(f => f > cur); setFrame(n !== undefined ? n : T.length - 1, true); };
    prevBtn.onclick = () => { stop(); const p = [...joins].reverse().find(f => f < cur); setFrame(p !== undefined ? p : 0, true); };
    slider.addEventListener("input", () => { stop(); setFrame(+slider.value, true); });
    stopRing = stop;
    setFrame(T.length - 1);
  }

  // ------------------------------------------------------------------ Monitor and Detectors pages
  function renderMonitor() {
    const v = $("#view"); v.innerHTML = "";
    const t = h("table", {class: "ledger"}, h("thead", {}, h("tr", {}, ["Finding", "Sweep", "Card", "Verdict", "Pattern", "Exposure", "SAR"].map(x => h("th", {text: x})))));
    const tb = h("tbody");
    M.forEach(m => tb.append(h("tr", {}, h("td", {}, h("span", {class: "cid", text: m.case_id}), h("div", {class: "ref", text: m.why})),
      h("td", {text: String(m.sweep || "").replace(/_/g, " ")}), h("td", {class: "mono", text: m.card}), h("td", {}, verdictDot(m.verdict)),
      h("td", {text: PAT[m.pattern] || m.pattern}), h("td", {text: money(m.exposure)}), h("td", {text: m.sar ? "filed" : "no"}))));
    if (!M.length) tb.append(h("tr", {}, h("td", {colspan: "7", class: "faint", text: "No monitor findings on disk (monitor/ or round1/monitor/)."})));
    t.append(tb);
    v.append(h("div", {class: "mon"}, h("h1", {text: "What the monitor found on its own"}),
      h("p", {class: "lede", text: "Beyond the exam cases, Kavach sweeps November and December for activity no alert pointed at: bursts of purchases just under a round limit, scripted device rings, and rare devices paying the same amount on several cards. Each finding was investigated by the same agent and policy engine."}),
      h("div", {class: "panel"}, t)));
    markPipes(v);
  }

  function btCell(v, label) { return h("div", {}, h("div", {class: "v", text: v}), h("div", {class: "pl", text: label})); }
  function detectorBlock(s) {
    const bt = s.backtest || {}, ap = s.approval, g = s.gate, fw = bt.forward || {};
    const statusTag = s.kind === "approved" ? (g && g.passes === false ? h("span", {class: "tag", style: "color:var(--fraud);border-color:currentColor", text: "approved, refused at load"}) : h("span", {class: "tag lead", text: "approved, runs at detect time"}))
      : s.kind === "rejected" ? h("span", {class: "tag", text: "rejected"}) : h("span", {class: "tag", style: "color:var(--uncertain);border-color:currentColor", text: "awaiting L2 approval"});
    const rate = bt.population_rate !== undefined && bt.population_rate !== null ? (bt.population_rate * 100).toFixed(3) + "%" : "n/a";
    const blk = h("div", {class: "panel det"},
      h("div", {class: "det-h"}, h("span", {class: "nm", text: s.name}), s.title ? h("span", {class: "ti", text: s.title}) : null, h("span", {class: "sp"}), statusTag),
      h("div", {class: "bt", role: "group", "aria-label": `Backtest of ${s.name}`},
        btCell(`${int(bt.support)} of ${int(bt.n_fraud_cases)}`, "fraud caught"),
        btCell(int(bt.cleared_hits), `legitimate hit, of ${int(bt.n_cleared_cases)}`),
        btCell(bt.lift !== undefined ? Number(bt.lift).toFixed(2) : "n/a", "lift"),
        btCell(bt.precision !== undefined ? Number(bt.precision).toFixed(2) : "n/a", "precision"),
        btCell(rate, `fire rate, ${int(bt.population_sample)} txns`),
        btCell(fw.fired_txns !== undefined ? plural(fw.fired_txns, "txn") : "n/a", `January, ${plural(fw.fired_cards, "card")}`)),
      h("div", {class: "det-b"},
        s.rule ? h("p", {class: "rule"}, "Rule: ", s.rule) : null,
        s.description ? h("p", {}, s.description, s.description_source ? h("span", {class: "faint", text: ` (description: ${s.description_source})`}) : null) : null,
        h("div", {class: "kvrow"},
          h("span", {text: "Confirmed fraud it caught"}), idChips(bt.fraud_case_ids, 12),
          h("span", {text: "Legitimate customers it would have acted against"}), (bt.cleared_case_ids || []).length ? idChips(bt.cleared_case_ids, 12) : h("span", {text: "none in the closed history"}),
          (bt.example_txn_ids || []).length ? [h("span", {text: "Example transactions"}), idChips(bt.example_txn_ids, 10)] : null,
          (fw.pack_flagged_txn_hits || []).length ? [h("span", {text: "Exam alerts it fires on"}), idChips(fw.pack_flagged_txn_hits, 10)] : null,
          fw.entity_values ? [h("span", {text: "January values"}), h("span", {class: "mono", text: Object.entries(fw.entity_values).map(([k, n]) => `${k} (${n})`).join(", ")})] : null,
          h("span", {text: "Parameters"}), h("span", {class: "mono", text: Object.entries(s.params || {}).map(([k, v]) => `${k}=${v}`).join(", ") || "none"}),
          bt.lane ? [h("span", {text: "Mining lane"}), h("span", {}, `${bt.lane}${bt.status ? ", " + bt.status : ""}${bt.rediscovers ? ", rediscovers " + bt.rediscovers : ""}${bt.p_adj !== undefined ? `, adjusted p ${Number(bt.p_adj).toExponential(1)}` : ""}`)] : null,
          h("span", {text: "Approval"}), h("span", {}, ap ? `${ap.role || ""} ${ap.id ? "record " + ap.id : ""} ${ap.ts ? "at " + utc(ap.ts) : ""}`.trim() : "none yet"),
          g ? [h("span", {text: "Load gate"}), h("span", {class: g.passes ? "ok" : g.passes === false ? "bad" : "faint", text: g.reason})] : null,
          h("span", {text: "Spec"}), h("span", {class: "mono", text: `${s.path}${s.dataset_version ? " · dataset " + s.dataset_version : ""}`}))));
    return blk;
  }
  function renderDetectors() {
    const v = $("#view"); v.innerHTML = "";
    const wrap = h("div", {class: "mon"});
    const ap = DET.approved || [], pr = DET.proposed || [], rj = DET.rejected || [], ty = DET.typologies || [];
    const any = [...ap, ...pr, ...rj][0];
    const nf = any && any.backtest ? any.backtest.n_fraud_cases : null, nc = any && any.backtest ? any.backtest.n_cleared_cases : null;
    wrap.append(h("h1", {text: "Detectors the agent grew"}),
      h("p", {class: "lede", text: `The agent mines the bank's closed cases${nf ? ` (${int(nf)} confirmed fraud, ${int(nc)} cleared)` : ""} for patterns no hand-written detector covers, backtests each candidate, and asks a fraud manager (L2) to approve it before it joins the toolkit. Only an approved detector whose spec still matches its approval runs at detect time.`}));
    wrap.append(section("Approved", ap.length ? `${ap.length}` : null,
      ap.length ? ap.map(detectorBlock) : empty("No grown detector is approved yet", "Approval needs an L2 token; until then a proposal never runs.", "python -m kavach grow approve <name> --token <L2 token>")));
    if (pr.length) wrap.append(section("Awaiting L2 approval", `${pr.length} proposal${pr.length > 1 ? "s" : ""}, not run by the agent`, pr.map(detectorBlock)));
    if (rj.length) wrap.append(section("Rejected", `${rj.length}`, rj.map(detectorBlock)));
    if (ty.length) {
      const t = h("table", {class: "ledger"}, h("thead", {}, h("tr", {}, ["Detector", "Chosen parameters", "Fraud caught", "Legitimate hit", "Lift", "Precision", "January"].map((x, i) => h("th", {class: i >= 2 && i <= 5 ? "num" : null, text: x})))));
      const tb = h("tbody");
      ty.forEach(b => {
        const ch = b.chosen || {};
        tb.append(h("tr", {},
          h("td", {}, h("span", {class: "mono", style: "font-weight:600", text: b.name}), h("div", {class: "rr", text: `${ch.status || ""}${ch.reason ? ": " + ch.reason : ""}`}), h("div", {class: "ref", text: `${b.path} · dataset ${b.dataset_version} · ${b.n_grid} grid points`})),
          h("td", {class: "mono", style: "font-size:12px", text: Object.entries(ch.params || {}).map(([k, v]) => `${k}=${v}`).join(", ")}),
          h("td", {class: "num", "data-l": "Fraud caught", text: `${int(ch.support)} of ${int(b.n_fraud)}`}),
          h("td", {class: "num", "data-l": "Legitimate hit"}, `${int(ch.cleared_hits)} of ${int(b.n_cleared)}`, b.cleared.length ? h("div", {class: "ids", style: "justify-content:flex-end;margin-top:4px"}, b.cleared.slice(0, 6).map(x => h("span", {class: "id", title: `txn ${x.txn}, card ${x.card}`, text: x.case_id}))) : null),
          h("td", {class: "num", "data-l": "Lift", text: ch.lift !== undefined ? Number(ch.lift).toFixed(2) : "n/a"}),
          h("td", {class: "num", "data-l": "Precision", text: ch.precision_closed !== undefined ? Number(ch.precision_closed).toFixed(3) : "n/a"}),
          h("td", {"data-l": "January", text: b.january && b.january.fired_txns !== undefined ? `${plural(b.january.fired_txns, "txn")}, ${plural(b.january.fired_cards, "card")}` : "n/a"})));
      });
      t.append(tb);
      wrap.append(section("Hand-written typology detectors", "backtested on the same closed cases; legitimate hits are the customers each would have acted against", h("div", {class: "panel"}, t)));
    }
    if (DET.gate_error) wrap.append(h("p", {class: "faint", text: `Load gate not checked: ${DET.gate_error}`}));
    v.append(wrap);
    markPipes(v);
  }

  // ------------------------------------------------------------------ routing
  function setView(which) {
    view = which;
    $("#tab-cases").setAttribute("aria-selected", String(which === "cases"));
    $("#tab-monitor").setAttribute("aria-selected", String(which === "monitor"));
    $("#tab-detectors").setAttribute("aria-selected", String(which === "detectors"));
    renderBarMeta();
  }
  function select(id, t, focus, keepScroll) {
    const a = byId(id) || inRound()[0] || ALL[0];
    if (!a) return;
    const sameCase = current === a.case_id && view === "cases";
    current = a.case_id; round = a._round;
    tab = t && TABS.some(([k]) => k === t) ? t : "decision";
    const hash = "#" + a.case_id + (tab !== "decision" ? "/" + tab : "");
    if (location.hash !== hash) history.replaceState(null, "", hash);
    setView("cases");
    renderRounds(); renderFilters(); renderList(); renderBarMeta();
    const top = $("#view").scrollTop, wtop = window.scrollY;
    renderCase(a);
    if (keepScroll && sameCase) { $("#view").scrollTop = top; window.scrollTo(0, wtop); } else { $("#view").scrollTop = 0; }
    if (focus) $("#view").focus({preventScroll: true});
  }
  function showPage(which) {
    if (stopRing) { stopRing(); stopRing = null; }
    setView(which);
    renderList();
    if (location.hash !== "#" + which) history.replaceState(null, "", "#" + which);
    (which === "monitor" ? renderMonitor : renderDetectors)();
    $("#view").scrollTop = 0;
  }
  function route() {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (raw === "monitor" || raw === "detectors") { showPage(raw); return; }
    const [id, t] = raw.split("/");
    select(byId(id) ? id : (current || (inRound()[0] || ALL[0] || {}).case_id), t, false);
  }
  $("#tab-cases").onclick = () => select(current || (inRound()[0] || {}).case_id, tab);
  $("#tab-monitor").onclick = () => showPage("monitor");
  $("#tab-detectors").onclick = () => showPage("detectors");
  document.addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select,[role=tab]") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key !== "j" && e.key !== "k") return;
    const list = visible(); const i = list.findIndex(x => x.case_id === current);
    const nx = list[Math.min(list.length - 1, Math.max(0, i + (e.key === "j" ? 1 : -1)))];
    if (nx) select(nx.case_id, tab, false);
  });
  window.addEventListener("hashchange", () => {
    const raw = decodeURIComponent(location.hash.slice(1)), [id, t] = raw.split("/");
    if (raw === "monitor" || raw === "detectors") { if (view !== raw) showPage(raw); return; }
    if (id && (id !== current || (t || "decision") !== tab || view !== "cases")) select(id, t, false);
  });

  renderRounds(); renderFilters();
  if (!ALL.length) {
    renderList();
    $("#view").append(h("div", {class: "mon"}, h("h1", {text: "No case data"}), h("p", {class: "lede", text: "Run python -m kavach site to build site/cases.js and site/data/ from the answer files."})));
    return;
  }
  route();
})();
</script>
