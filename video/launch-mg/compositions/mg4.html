  <script>
    const tl = gsap.timeline({ paused: true });
    const FPS = 30;
    // a count is a row of set() calls, one per frame, so every seek shows the same digits (no update callbacks)
    const count = (sel, from, to, at, seconds) => {
      const el = document.querySelector(sel);
      const last = Math.round(seconds * FPS);
      const ease = gsap.parseEase("power2.out");
      for (let f = 0; f <= last; f += 1) {
        const v = Math.round(from + (to - from) * ease(f / last));
        tl.set(el, { textContent: v.toLocaleString("en-US") }, at + f / FPS);
      }
    };
    const slam = (sel, at) =>
      tl.fromTo(
        sel,
        { opacity: 0, scale: 1.12, filter: "blur(10px)", transformOrigin: "0% 50%" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" },
        at,
      );
    const lineIn = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, at);
    const out = (sels, at) =>
      tl.to(sels, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, at);

    // the dot field for stage 3: 4 rows of 36, built once at load (static markup is not needed: nothing here is timed)
    const field = document.getElementById("mg4-field");
    for (let r = 0; r < 4; r += 1) {
      for (let c = 0; c < 36; c += 1) {
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", String(10 + c * 36));
        dot.setAttribute("cy", String(12 + r * 32));
        dot.setAttribute("r", "6");
        field.appendChild(dot);
      }
    }

    // stage 1: 18 of 18 on the grader; the ticks fill with the count (power2.out, like the digits)
    slam("#mg4-s1 .numeral", 0.1);
    count("#mg4-n1", 0, 18, 0.15, 1.2);
    lineIn("#mg4-s1 .label", 0.28);
    const ease1 = gsap.parseEase("power2.out");
    document.querySelectorAll("#mg4-ticks i").forEach((tick, i) => {
      // the frame on which the count first shows i+1
      let when = 1.2;
      for (let f = 0; f <= 36; f += 1) {
        if (Math.round(18 * ease1(f / 36)) >= i + 1) { when = f / 30; break; }
      }
      tl.fromTo(tick, { backgroundColor: "#eef0f3" }, { backgroundColor: "#141a21", duration: 0.06, ease: "none" }, 0.15 + when);
    });
    out(["#mg4-s1 .numeral", "#mg4-s1 .label", "#mg4-ticks"], 1.72);

    // stage 2: zero legitimate customers harmed; nine cards, a check drawn on each
    slam("#mg4-s2 .numeral", 1.9);
    lineIn("#mg4-s2 .label", 1.97);
    tl.fromTo("#mg4-cards .cardo", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", stagger: 0.05 }, 2.0);
    tl.fromTo("#mg4-cards .check", { strokeDasharray: 100, strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out", stagger: 0.09 }, 2.3);
    out(["#mg4-s2 .numeral", "#mg4-s2 .label", "#mg4-cards"], 3.42);

    // stage 3: the graph; the dot field fills in reading order over the same 1.4 s as the count
    slam("#mg4-s3 .numeral", 3.6);
    count("#mg4-n3", 0, 650938, 3.65, 1.4);
    lineIn("#mg4-s3 .label", 3.9);
    tl.fromTo("#mg4-field circle", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", stagger: 1.35 / 144 }, 3.65);
    out(["#mg4-s3 .numeral", "#mg4-s3 .label", "#mg4-field"], 5.12);

    // stage 4: the claim, then the ledger: rows appear, each RE-RUN lands its OK
    tl.fromTo(
      "#mg4-s4 .w",
      { color: "#b9c0c9", filter: "blur(6px)" },
      { color: "#c2491a", filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.08 },
      5.3,
    );
    lineIn("#mg4-s4 .sub", 5.45);
    tl.fromTo("#mg4-ledger .row", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out", stagger: 0.07 }, 5.5);
    tl.fromTo("#mg4-ledger .ok b", { opacity: 0, scale: 1.4, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out", stagger: 0.1 }, 5.85);
    window.__timelines["mg4"] = tl;
  </script>
