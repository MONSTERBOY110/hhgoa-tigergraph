<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kavach avatar at 48 px</title>
<style>
  /* avatar-400.png scaled to 48 px in a circle, as X shows it beside a post; light and dark timelines */
  html, body { margin: 0; padding: 0; width: 560px; height: 140px; overflow: hidden; background: #FFFFFF; }
  .panel { position: absolute; top: 0; width: 280px; height: 140px; }
  .light { left: 0; background: #FFFFFF; color: #0F1419; }
  .dark { left: 280px; background: #000000; color: #E7E9EA; }
  .panel img { position: absolute; left: 24px; top: 46px; width: 48px; height: 48px; border-radius: 50%; display: block; }
  .name { position: absolute; left: 84px; top: 50px; font: 700 15px/20px "Segoe UI", Arial, sans-serif; }
  .handle { position: absolute; left: 84px; top: 70px; font: 400 15px/20px "Segoe UI", Arial, sans-serif; color: #71767B; }
</style>
</head>
<body>
  <div class="panel light">
    <img src="avatar-400.png" alt="Kavach avatar at 48 px">
    <div class="name">Kavach</div>
    <div class="handle">@kavachhhgoa</div>
  </div>
  <div class="panel dark">
    <img src="avatar-400.png" alt="Kavach avatar at 48 px">
    <div class="name">Kavach</div>
    <div class="handle">@kavachhhgoa</div>
  </div>
</body>
</html>
