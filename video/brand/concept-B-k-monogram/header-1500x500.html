<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kavach X header</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 1500px; height: 500px; overflow: hidden; background: #EEF0F3; }
  svg { position: absolute; left: 0; top: 0; width: 1500px; height: 500px; display: block; }
  .wordmark { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 183.6px; letter-spacing: 0.01em; fill: #141A21; }
  .tagline { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 32.94px; letter-spacing: 0.01em; fill: #141A21; }
  .label { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 23.76px; letter-spacing: 0.14em; fill: #C2491A; }
  .edges line { stroke: #DCE0E6; stroke-width: 2; }
  .nodes circle { fill: #D0D6DD; }
</style>
</head>
<body>
<!--
  X banner, 1500 x 500. X covers the bottom left (about x 0 to 450, y 300 to 500) with the avatar,
  so the lockup sits right of centre (x 510 to 1345) and the faint graph lives in the margins.
  Lockup: shield silhouette 233 px tall; its peak sits 11 px above the cap height of KAVACH and its
  tip 14 px under the tagline baseline. KAVACH, the tagline and the label share one left ink edge (x 752)
  and KAVACH and the tagline share one right ink edge (x 1344).
-->
<svg viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1500" height="500" fill="#EEF0F3"/>

  <!-- faint graph: edges run off the frame, hubs are the nodes with three or four edges -->
  <g class="edges">
    <line x1="-40" y1="60" x2="66" y2="120"/>
    <line x1="66" y1="120" x2="186" y2="50"/>
    <line x1="186" y1="50" x2="250" y2="-50"/>
    <line x1="186" y1="50" x2="318" y2="150"/>
    <line x1="318" y1="150" x2="420" y2="-40"/>
    <line x1="66" y1="120" x2="210" y2="246"/>
    <line x1="318" y1="150" x2="210" y2="246"/>
    <line x1="318" y1="150" x2="420" y2="248"/>
    <line x1="210" y1="246" x2="90" y2="318"/>
    <line x1="90" y1="318" x2="-50" y2="330"/>
    <line x1="210" y1="246" x2="318" y2="372"/>
    <line x1="420" y1="248" x2="318" y2="372"/>
    <line x1="318" y1="372" x2="150" y2="440"/>
    <line x1="90" y1="318" x2="150" y2="440"/>
    <line x1="150" y1="440" x2="120" y2="560"/>
    <line x1="318" y1="372" x2="446" y2="470"/>
    <line x1="446" y1="470" x2="520" y2="560"/>
    <line x1="1580" y1="30" x2="1440" y2="84"/>
    <line x1="1440" y1="84" x2="1418" y2="262"/>
    <line x1="1418" y1="262" x2="1590" y2="236"/>
    <line x1="1418" y1="262" x2="1472" y2="410"/>
    <line x1="1472" y1="410" x2="1580" y2="480"/>
    <line x1="1472" y1="410" x2="1452" y2="570"/>
  </g>
  <g class="nodes">
    <circle cx="66" cy="120" r="6.5"/>
    <circle cx="186" cy="50" r="6.5"/>
    <circle cx="318" cy="150" r="8"/>
    <circle cx="210" cy="246" r="8"/>
    <circle cx="90" cy="318" r="6.5"/>
    <circle cx="420" cy="248" r="5"/>
    <circle cx="318" cy="372" r="8"/>
    <circle cx="150" cy="440" r="6.5"/>
    <circle cx="446" cy="470" r="5"/>
    <circle cx="1440" cy="84" r="5"/>
    <circle cx="1418" cy="262" r="6.5"/>
    <circle cx="1472" cy="410" r="6.5"/>
  </g>

  <!-- the mark: logo.svg at 1.715x (silhouette 233 px tall), silhouette left edge at x 510 -->
  <g transform="translate(503.14 104.05) scale(1.715294)">
    <path d="M60 6 L112 26 V64 C112 98 88 120 60 134 C32 120 8 98 8 64 V26 Z" fill="#C2491A" stroke="#C2491A" stroke-width="8" stroke-linejoin="round"/>
    <g fill="#EEF0F3">
      <path d="M42 32 V100 M42 65 L80 32 M42 65 L80 100" fill="none" stroke="#EEF0F3" stroke-width="13"/>
      <circle cx="42" cy="32" r="12"/>
      <circle cx="42" cy="100" r="12"/>
      <circle cx="80" cy="32" r="12"/>
      <circle cx="80" cy="100" r="12"/>
      <circle cx="42" cy="65" r="15"/>
    </g>
  </g>

  <!-- type: x positions compensate each font's left side bearing so the ink lines up -->
  <text class="wordmark" x="741.70" y="267">KAVACH</text>
  <text class="tagline" x="751.79" y="326.61">AN AI FRAUD INVESTIGATOR A BANK CAN RUN</text>
  <text class="label" x="750.80" y="372.59">BUILT ON TIGERGRAPH</text>
</svg>
</body>
</html>
