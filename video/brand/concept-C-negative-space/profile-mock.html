<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kavach profile mock</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1240px; height: 360px; overflow: hidden; display: flex; gap: 0; font-family: "Segoe UI", system-ui, sans-serif; }
  .page { width: 620px; height: 360px; box-sizing: border-box; padding: 10px; }
  .light { background: #FFFFFF; color: #0F1419; } .dark { background: #000000; color: #E7E9EA; }
  .profile { position: relative; width: 600px; }
  .header { display: block; width: 600px; height: 200px; }
  .av { position: absolute; left: 16px; top: 133px; width: 134px; height: 134px; border-radius: 50%; box-sizing: border-box; }
  .light .av { border: 4px solid #FFFFFF; } .dark .av { border: 4px solid #000000; }
  .meta { padding: 76px 16px 0; }
  .name { font-size: 20px; font-weight: 800; line-height: 24px; }
  .handle { font-size: 15px; line-height: 20px; }
  .light .handle { color: #536471; } .dark .handle { color: #71767B; }
</style>
</head>
<body>
  <div class="page light"><div class="profile">
    <img class="header" src="header-1500x500.png" alt="">
    <img class="av" src="avatar-400.png" alt="">
    <div class="meta"><div class="name">Kavach</div><div class="handle">@kavachhhgoa</div></div>
  </div></div>
  <div class="page dark"><div class="profile">
    <img class="header" src="header-1500x500.png" alt="">
    <img class="av" src="avatar-400.png" alt="">
    <div class="meta"><div class="name">Kavach</div><div class="handle">@kavachhhgoa</div></div>
  </div></div>
</body>
</html>
