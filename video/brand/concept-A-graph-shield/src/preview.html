<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=480">
<title>Kavach</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; width: 480px; height: 160px; overflow: hidden; }

body { background: #ffffff; font-family: 'IBM Plex Mono', monospace; }
.sheet { display: flex; width: 480px; height: 160px; }
.panel { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 22px; }
.light { background: #ffffff; color: #0f1419; }
.dark { background: #000000; color: #e7e9ea; }
.row { display: flex; align-items: center; gap: 10px; }
.av { width: 48px; height: 48px; border-radius: 50%; display: block; flex: none; }
.name { font: 700 15px/1.2 system-ui, 'Segoe UI', sans-serif; }
.handle { font: 400 13px/1.2 system-ui, 'Segoe UI', sans-serif; opacity: 0.6; }
.label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; }

</style></head>
<body>
<div class="sheet"><div class="panel light"><div class="label">48 px on white</div><div class="row"><img class="av" src="../avatar-400.png" alt=""><div><div class="name">Kavach</div><div class="handle">@kavachhhgoa</div></div></div><div class="row"><img class="av" src="../avatar-400-paper.png" alt=""><div><div class="name">Kavach</div><div class="handle">paper ground (alternate)</div></div></div></div><div class="panel dark"><div class="label">48 px on black</div><div class="row"><img class="av" src="../avatar-400.png" alt=""><div><div class="name">Kavach</div><div class="handle">@kavachhhgoa</div></div></div><div class="row"><img class="av" src="../avatar-400-paper.png" alt=""><div><div class="name">Kavach</div><div class="handle">paper ground (alternate)</div></div></div></div></div>
</body></html>
